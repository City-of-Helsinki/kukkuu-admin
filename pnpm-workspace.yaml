# Block installation of dependencies released less than 1 week ago (supply-chain hardening)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - obug@2.2.1
  - '@city-of-helsinki/license-notices@0.1.0'

# Allow build/postinstall scripts only for dependencies that genuinely need them.
# (pnpm blocks all build scripts by default; yarn used to run them unconditionally.)
allowBuilds:
  # Vite's bundler – required for dev server, build and tests
  esbuild: true
  # ICU/locale data for the fi-FI test toolchain
  full-icu: true

# Translated from the former package.json "resolutions" field
overrides:
  '@fastify/busboy': 3.2.2
  '@graphql-tools/executor-legacy-ws': 1.1.39
  '@graphql-tools/utils': 12.0.2
  '@types/minimatch': ^5.1.2
  brace-expansion: 5.0.12
  dompurify: 3.4.17
  fast-uri: 3.1.9
  js-yaml: 4.3.2
  lodash: ^4.18.1
  moment: 2.31.0
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  underscore: ^1.13.8
